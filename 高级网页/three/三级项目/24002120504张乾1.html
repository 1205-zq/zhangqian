<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>作业帮大学版首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../iconfont.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#388BFF',
                        redBadge: '#FF4D4F',
                    }
                }
            }
        }
    </script>
    <style type="text/css">
        .glass-card {
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .tab-active {
            color: #388BFF;
        }

        .safe-top {
            padding-top: env(safe-area-inset-top);
        }

        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: #ffffff;
        }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen relative safe-top">
    <!-- 顶部导航 -->
    <div class="flex justify-between items-center px-5 py-4">
        <div>
            <div class="flex items-center gap-1 text-lg font-medium">
                大三 <i class="fa fa-chevron-down text-sm text-gray-500"></i>
            </div>
            <div class="text-xs text-gray-500 mt-0.5">邢台市</div>
        </div>
        <div class="flex gap-5 items-center text-xl text-gray-800">
            <i class="fa fa-search"></i>
            <a href="24002120504张乾2.html" class="block" title="资料检索"><i class="iconfont icon-biaodan"></i></a>
            <a href="24002120504张乾3.html" class="relative block" title="消息">
                <i class="iconfont icon-xiaoxi"></i>
                <span class="absolute -top-2 -right-2 bg-redBadge text-white text-xs px-1.5 rounded-full">32</span>
            </a>
            <a href="24002120504张乾5.html" class="block" title="历史记录"><i class="iconfont icon-shijian"></i></a>
        </div>
    </div>

    <!-- 四大功能卡片 -->
    <div class="grid grid-cols-4 gap-3 px-4">
        <div class="glass-card bg-gradient-to-b from-blue-100 to-blue-50">
            <div class="w-14 h-14 rounded-full bg-blue-400/20 flex items-center justify-center text-blue-600 text-3xl">Q</div>
            <span class="text-sm mt-2 font-medium">大学搜题</span>
        </div>
        <div class="glass-card bg-gradient-to-b from-green-100 to-green-50">
            <div class="w-14 h-14 rounded-full bg-green-400/20 flex items-center justify-center text-green-600 text-3xl">⟳</div>
            <span class="text-sm mt-2 font-medium">拍照翻译</span>
        </div>
        <div class="glass-card bg-gradient-to-b from-sky-100 to-sky-50">
            <div class="w-14 h-14 rounded-full bg-sky-400/20 flex items-center justify-center text-sky-600 text-3xl">⟲</div>
            <span class="text-sm mt-2 font-medium">扫码搜书</span>
        </div>
        <div class="glass-card bg-gradient-to-b from-red-100 to-red-50">
            <div class="w-14 h-14 rounded-full bg-red-400/20 flex items-center justify-center text-red-600 text-3xl">✓</div>
            <span class="text-sm mt-2 font-medium">家教批改</span>
        </div>
    </div>

    <!-- 横向滚动小功能区 -->
    <div class="mt-5 px-4">
        <div class="flex overflow-x-auto gap-8 pb-2">
            <div class="flex flex-col items-center min-w-fit">
                <div class="w-10 h-10 border-2 border-gray-800 rounded-lg flex items-center justify-center"><i class="fa fa-camera"></i></div>
                <span class="text-xs mt-2 text-gray-700">家教搜题</span>
            </div>
            <div class="flex flex-col items-center min-w-fit">
                <div class="w-10 h-10 border-2 border-gray-800 rounded-lg flex items-center justify-center"><i class="fa fa-check-square-o"></i></div>
                <span class="text-xs mt-2 text-gray-700">家教批改</span>
            </div>
            <div class="flex flex-col items-center min-w-fit">
                <div class="w-10 h-10 border-2 border-gray-800 rounded-lg flex items-center justify-center"><i class="fa fa-crown"></i></div>
                <span class="text-xs mt-2 text-gray-700">VIP特惠</span>
            </div>
            <div class="flex flex-col items-center min-w-fit">
                <div class="w-10 h-10 border-2 border-gray-800 rounded-lg flex items-center justify-center"><i class="fa fa-star"></i></div>
                <span class="text-xs mt-2 text-gray-700">百科大赛</span>
            </div>
            <div class="flex flex-col items-center min-w-fit">
                <div class="w-10 h-10 border-2 border-gray-800 rounded-lg flex items-center justify-center"><i class="fa fa-pencil"></i></div>
                <span class="text-xs mt-2 text-gray-700">语文作文</span>
            </div>
        </div>
        <!-- 滚动指示器 -->
        <div class="flex justify-center mt-1 gap-1">
            <div class="w-3 h-1 rounded-full bg-primary"></div>
            <div class="w-1 h-1 rounded-full bg-gray-300"></div>
        </div>
    </div>

    <!-- AI小帮对话区域 -->
    <div class="mt-6 px-4">
        <div class="bg-white rounded-2xl p-5 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-blue-200 overflow-hidden flex items-center justify-center">
                    <i class="fa fa-user text-2xl text-blue-600"></i>
                </div>
                <span class="text-xl font-medium">我是小帮</span>
            </div>
            <p class="text-xl my-5">任何问题都能在这里找到答案！快来提问吧~</p>
            <!-- 推荐问题气泡 -->
            <div class="space-y-3">
                <div class="bg-gray-100 rounded-full py-3 px-4 w-fit">
                    <p class="text-sm">你的目标大学是哪所？来聊聊</p>
                </div>
                <div class="bg-gray-100 rounded-full py-3 px-4 w-fit">
                    <p class="text-sm">诗词之旅新玩法上线啦！</p>
                </div>
                <div class="bg-gray-100 rounded-full py-3 px-4 w-fit">
                    <p class="text-sm">你知道月球上的一天有多长吗</p>
                </div>
            </div>
            <div class="mt-4 text-gray-400 text-sm flex items-center gap-1">
                <i class="fa fa-refresh"></i>
                <span>换一换</span>
            </div>
        </div>
    </div>

    <!-- 快捷工具栏 -->
    <div class="px-4 mt-6">
        <div class="grid grid-cols-4 gap-3">
            <div class="bg-gray-100 rounded-full py-2.5 flex items-center justify-center gap-1">
                <i class="fa fa-camera"></i>
                <span class="text-xs">搜索答疑</span>
            </div>
            <div class="bg-gray-100 rounded-full py-2.5 flex items-center justify-center gap-1">
                <i class="fa fa-pencil"></i>
                <span class="text-xs">AI写作</span>
            </div>
            <div class="bg-gray-100 rounded-full py-2.5 flex items-center justify-center gap-1">
                <i class="fa fa-lightbulb-o"></i>
                <span class="text-xs">涨知识</span>
            </div>
            <div class="bg-gray-100 rounded-full py-2.5 flex items-center justify-center gap-1">
                <i class="fa fa-search"></i>
                <span class="text-xs">搜资料</span>
            </div>
        </div>
    </div>

    <!-- 底部输入框 -->
    <div class="px-4 mt-5">
        <div class="bg-white rounded-full shadow-lg flex items-center px-4 py-3">
            <i class="fa fa-camera text-lg"></i>
            <input type="text" placeholder="发消息或按住说话..." class="flex-1 outline-none px-3 text-sm">
            <i class="fa fa-microphone text-lg"></i>
        </div>
    </div>

    <!-- 底部Tab导航 -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white shadow-md safe-bottom">
        <div class="grid grid-cols-5 py-3">
            <a href="24002120504张乾1.html" class="text-center tab-active block">
                <i class="iconfont icon-a-235_zhuye text-xl block"></i>
                <div class="text-xs mt-1">首页</div>
            </a>
            <a href="24002120504张乾2.html" class="text-center text-gray-500 block">
                <i class="iconfont icon-biaoqian text-xl block"></i>
                <div class="text-xs mt-1">资料库</div>
            </a>
            <a href="24002120504张乾3.html" class="text-center text-gray-500 block">
                <i class="iconfont icon-a-235_huiyuan text-xl block"></i>
                <div class="text-xs mt-1">VIP</div>
            </a>
            <a href="24002120504张乾4.html" class="text-center text-gray-500 block">
                <i class="iconfont icon-gougou text-xl block"></i>
                <div class="text-xs mt-1">推荐</div>
            </a>
            <a href="24002120504张乾5.html" class="text-center text-gray-500 relative block">
                <span class="absolute top-0 right-4 w-2 h-2 bg-redBadge rounded-full"></span>
                <i class="iconfont icon-user text-xl block"></i>
                <div class="text-xs mt-1">我</div>
            </a>
        </div>
    </div>

</body>
</html>
